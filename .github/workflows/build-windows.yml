name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compute build version
      id: version
      shell: pwsh
      run: |
        $pkg = Get-Content "daedalus-dialog-editor/package.json" -Raw | ConvertFrom-Json
        $base = $pkg.version
        $buildNum = $env:GITHUB_RUN_NUMBER
        $buildVersion = "${base}-build.${buildNum}"
        "BASE_VERSION=$base" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Build version: $buildVersion"

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.23.0

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Stamp build version into package.json
      shell: pwsh
      run: |
        $buildVersion = "${{ steps.version.outputs.BUILD_VERSION }}"
        $pkgPath = "daedalus-dialog-editor/package.json"
        $pkg = Get-Content $pkgPath -Raw | ConvertFrom-Json
        $pkg.version = $buildVersion
        $pkg | ConvertTo-Json -Depth 10 | Set-Content $pkgPath -Encoding UTF8
        Write-Host "Stamped version $buildVersion into package.json"

    - name: Clean previous build outputs
      shell: pwsh
      run: |
        if (Test-Path "daedalus-dialog-editor/dist") {
          Remove-Item "daedalus-dialog-editor/dist" -Recurse -Force
        }

    - name: Build Parser
      run: pnpm --filter daedalus-parser run build

    - name: Build Editor
      run: pnpm --filter daedalus-dialog-editor run build

    - name: Package Editor
      env:
        npm_execpath: pnpm.cmd
      run: pnpm --filter daedalus-dialog-editor run package

    - name: Verify packaged app dependencies
      shell: pwsh
      run: |
        @'
        const path = require('path');
        const electronBuilderDir = path.dirname(
          require.resolve('electron-builder/package.json', { paths: ['daedalus-dialog-editor'] })
        );
        const asar = require(require.resolve('@electron/asar', { paths: [electronBuilderDir] }));
        const appAsarPath = 'daedalus-dialog-editor/dist/win-unpacked/resources/app.asar';
        const files = asar.listPackage(appAsarPath);
        const hasSafeBuffer = files.some((f) => f === '\\node_modules\\safe-buffer\\index.js');
        const hasSaferBuffer = files.some((f) => f === '\\node_modules\\safer-buffer\\safer.js');
        if (!hasSafeBuffer || !hasSaferBuffer) {
          console.error('Missing packaged buffer modules:', { hasSafeBuffer, hasSaferBuffer });
          process.exit(1);
        }
        console.log('Packaged buffer modules verified:', { hasSafeBuffer, hasSaferBuffer, files: files.length });
        '@ | node -

    - name: Smoke-test packaged app startup
      shell: pwsh
      run: |
        $exe = "daedalus-dialog-editor/dist/win-unpacked/Daedalus Dialog Editor.exe"
        if (-not (Test-Path $exe)) {
          throw "Packaged app executable not found: $exe"
        }

        $process = Start-Process -FilePath $exe -PassThru
        Start-Sleep -Seconds 8

        if ($process.HasExited) {
          throw "Packaged app exited early with code $($process.ExitCode)"
        }

        Stop-Process -Id $process.Id -Force

    - name: Normalize installer filename
      shell: pwsh
      run: |
        $installer = Get-ChildItem -Path "daedalus-dialog-editor/dist" -Filter "*.exe" |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1
        if (-not $installer) {
          throw "No .exe file found in daedalus-dialog-editor/dist"
        }
        Copy-Item $installer.FullName "daedalus-dialog-editor/dist/daedalus-dialog-editor-windows-latest.exe" -Force

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: daedalus-dialog-editor-${{ steps.version.outputs.BUILD_VERSION }}
        path: daedalus-dialog-editor/dist/daedalus-dialog-editor-windows-latest.exe

    - name: Publish rolling release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: windows-latest
        name: Latest Windows Build (${{ steps.version.outputs.BUILD_VERSION }})
        body: |
          Automated rolling Windows build from GitHub Actions.

          **Version:** `${{ steps.version.outputs.BUILD_VERSION }}`
          **Base version:** `${{ steps.version.outputs.BASE_VERSION }}`
          **Build number:** #${{ github.run_number }}

          Download `daedalus-dialog-editor-windows-latest.exe` from this release.
        prerelease: true
        files: daedalus-dialog-editor/dist/daedalus-dialog-editor-windows-latest.exe
        make_latest: false
