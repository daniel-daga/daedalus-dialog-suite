name: All Tests

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main,master]
  pull_request:
    branches: [main,master]

permissions:
  contents: read

jobs:
  zen-world-tests:
    name: zen-world (level-editor domain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test zen-world
        run: pnpm --filter zen-world test

      - name: Typecheck zen-world
        run: pnpm --filter zen-world run typecheck

      - name: Lint zen-world
        run: pnpm --filter zen-world run lint

  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck editor main process
        run: pnpm --filter daedalus-dialog-editor run build:main

      - name: Typecheck editor renderer
        run: pnpm --filter daedalus-dialog-editor run typecheck:renderer
      - name: Build editor renderer (warning guard)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter daedalus-dialog-editor run build:renderer 2>&1 | tee /tmp/editor-renderer-build.log

          if grep -q "Some chunks are larger than" /tmp/editor-renderer-build.log; then
            echo "Renderer build emitted chunk-size warning."
            exit 1
          fi

          eval_lines=$(grep -i "eval" /tmp/editor-renderer-build.log || true)
          if [ -n "$eval_lines" ]; then
            echo "Renderer build emitted unexpected eval warnings:"
            echo "$eval_lines"
            exit 1
          fi
      - name: Run editor tests
        run: pnpm --filter daedalus-dialog-editor test

      - name: Lint editor
        run: pnpm --filter daedalus-dialog-editor run lint

  editor-ui-tests:
    name: UI Tests (browser harness, shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: ${{ github.event_name == 'pull_request' && fromJSON('[1, 2]') || fromJSON('[1, 2, 3, 4]') }}
        shardTotal: ${{ github.event_name == 'pull_request' && fromJSON('[2, 2]') || fromJSON('[4, 4, 4, 4]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter daedalus-dialog-editor exec playwright install --with-deps chromium

      - name: Run editor UI tests (browser harness, shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: daedalus-dialog-editor
        run: pnpm exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-blob-${{ matrix.shardIndex }}
          path: daedalus-dialog-editor/blob-report
          if-no-files-found: ignore
          retention-days: 1

  editor-ui-merge-reports:
    name: UI Tests (browser harness, merge reports)
    needs: editor-ui-tests
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-blob-*
          path: daedalus-dialog-editor/all-blob-reports
          merge-multiple: true

      - name: Merge Playwright reports
        run: pnpm --filter daedalus-dialog-editor exec playwright merge-reports --reporter html ./all-blob-reports
        working-directory: daedalus-dialog-editor

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: daedalus-dialog-editor/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  editor-e2e-electron:
    name: E2E Tests (real Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds dist/main + dist/renderer, which the harness launches with
      # NODE_ENV=production. Electron itself comes from the pnpm install
      # postinstall — no `playwright install` (Electron is the browser here).
      - name: Build editor
        run: pnpm --filter daedalus-dialog-editor run build

      - name: Run real-Electron E2E suite
        working-directory: daedalus-dialog-editor
        run: xvfb-run --auto-servernum pnpm exec playwright test -c playwright.electron.config.ts

      - name: Upload Electron E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-electron
          path: daedalus-dialog-editor/playwright-report-electron
          if-no-files-found: ignore
          retention-days: 7

  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parser tests
        run: pnpm --filter daedalus-parser test

      - name: Lint parser
        run: pnpm --filter daedalus-parser run lint

      - name: Typecheck parser
        run: pnpm --filter daedalus-parser run typecheck

  roundtrip-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run roundtrip corpus
        run: pnpm run test:roundtrip-corpus -- --root test/fixtures/corpus --strict

      - name: Upload roundtrip reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-corpus-reports
          path: |
            reports/dialog-roundtrip-corpus-summary.json
            reports/dialog-roundtrip-corpus-summary.md
            reports/dialog-roundtrip-corpus-details.json
            reports/dialog-roundtrip-corpus-byte-idempotence.json
          if-no-files-found: warn
          retention-days: 7





