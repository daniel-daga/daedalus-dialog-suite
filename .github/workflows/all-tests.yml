name: All Tests

on:
  workflow_dispatch:
  push:
    branches: [main,master]
  pull_request:
    branches: [main,master]

permissions:
  contents: read

jobs:
  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck editor renderer
        run: pnpm --filter daedalus-dialog-editor run typecheck:renderer
      - name: Build editor renderer (warning guard)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter daedalus-dialog-editor run build:renderer 2>&1 | tee /tmp/editor-renderer-build.log

          if grep -q "Some chunks are larger than" /tmp/editor-renderer-build.log; then
            echo "Renderer build emitted chunk-size warning."
            exit 1
          fi

          eval_lines=$(grep -i "eval" /tmp/editor-renderer-build.log || true)
          if [ -n "$eval_lines" ]; then
            non_litegraph_eval=$(echo "$eval_lines" | grep -vi "litegraph" || true)
            if [ -n "$non_litegraph_eval" ]; then
              echo "Renderer build emitted unexpected eval warnings:"
              echo "$non_litegraph_eval"
              exit 1
            fi
          fi
      - name: Run editor tests
        run: pnpm --filter daedalus-dialog-editor test

  editor-e2e-tests:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter daedalus-dialog-editor exec playwright install --with-deps chromium

      - name: Run editor E2E tests
        run: pnpm --filter daedalus-dialog-editor run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            daedalus-dialog-editor/playwright-report
            daedalus-dialog-editor/test-results
          if-no-files-found: ignore

  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run parser tests
        run: pnpm --filter daedalus-parser test

  roundtrip-corpus:
    runs-on: ubuntu-latest
    if: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run roundtrip corpus
        run: pnpm run test:roundtrip-corpus

      - name: Upload roundtrip reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roundtrip-corpus-reports
          path: |
            reports/dialog-roundtrip-corpus-summary.json
            reports/dialog-roundtrip-corpus-summary.md
            reports/dialog-roundtrip-corpus-details.json
            reports/dialog-roundtrip-corpus-byte-idempotence.json
          if-no-files-found: warn





