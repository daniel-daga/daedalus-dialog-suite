name: Nightly

# Runs the full all-tests.yml matrix on master once a night, but only when
# master moved in the last 24 hours. Every other workflow is manual.
on:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  changed:
    name: master changed in the last 24h?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          head=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - head )) -lt 86400 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No commit on master in the last 24h; skipping."
          fi

  tests:
    needs: changed
    if: needs.changed.outputs.changed == 'true'
    uses: ./.github/workflows/all-tests.yml
