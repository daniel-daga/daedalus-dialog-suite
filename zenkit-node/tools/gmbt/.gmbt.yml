# GMBT project for playing a candidate world in the engine.
#
#   node ../mutate.js ../cand        # build the candidates
#   copy ..\cand\07a-frame-torch.zen mod\Worlds\NEWWORLD.ZEN
#   gmbt test --world=NEWWORLD.ZEN --windowed --noaudio --nomenu -D --noupdatesubtitles
#
# THE WORLD MUST BE NAMED NEWWORLD.ZEN. The engine spawns its NPCs from
# STARTUP_<worldfile>; a candidate played as 07A.ZEN loads with no NPC at all.
# engine-batch.ps1 stages one candidate at a time under that name.
#
# THE ASSET DIRS MUST SUPPLY A COMPLETE SCRIPT TREE. GMBT moves the install's
# _work/Data aside, backs up only the directories it does not manage (Music,
# Presets, Video) and rebuilds the rest FROM THESE DIRS — so a `mod` that holds
# only Worlds produces a _work with no Scripts, the compile dies on
# `SYSTEM\MUSIC.SRC not found`, and the retail extraction is gone. That is why
# `mdk` carries the whole MDK script tree and is listed first, exactly as the
# beppo project does it. Learned the hard way on 2026-08-29; the recovery is in
# environment-hazards.md.
#
# --noupdatesubtitles is required: GMBT 0.22 throws a KeyNotFoundException in
# UpdateDialogs() on this script set.
#
# World files under mod/Worlds must be UPPER-CASE on disk: GMBT upper-cases
# --world and compares it case-sensitively against the on-disk names, and a
# miss surfaces as "Unknown error: KeyNotFoundException ... in
# DetectIfWorldIsNotExists" (its file-not-found message key is itself missing),
# not as a message naming the world. engine-batch.ps1 stages them that way.
#
# `gmbt test` merges the asset dirs into <gothicRoot>\_work\Data and plays the
# loose files there; modVdf.output is what `gmbt build` would write, and
# nothing here builds it.
#
# Never --full: GMBT refuses it without a script reparse ("Full test requires
# scripts reparse"), and this harness never reparses. A plain `gmbt test` merges
# the asset dirs every run; --reinstall is for after this file changes.

projectName: DDS World Candidates

gothicRoot: C:\Program Files (x86)\Steam\steamapps\common\Gothic II

modFiles:
  assets:
    - mdk      # the retail script tree; without it nothing compiles
    - mod      # the candidate worlds, overriding mdk
  defaultWorld: NEWWORLD.ZEN

modVdf:
  output:  C:\Program Files (x86)\Steam\steamapps\common\Gothic II\Data\ModVDF\DDS-CAND.mod
  comment: Daedalus Dialog Suite - engine candidates

gothicIniOverrides:
  # Two unskippable clips in front of every run.
  - 'GAME.playLogoVideos' : '0'
