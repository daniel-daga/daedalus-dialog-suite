# GMBT project for playing a candidate world without touching a retail asset.
#
# engine-batch.ps1 installs a candidate by OVERWRITING
# _work/Data/Worlds/NewWorld/NewWorld.zen and restoring a backup afterwards, so
# a crash between the two leaves a retail world replaced. GMBT builds a .mod
# instead and takes the world by name, so nothing under _work is rewritten.
#
#   node ../mutate.js mod/Worlds          # stage the candidates
#   gmbt test --world=07A.ZEN --windowed --noaudio --nomenu -D
#
# The FIRST run, and any run after this file changes, must add --full: GMBT
# refuses with "requires full test or full compilation" otherwise, and the
# message does not say that editing the config is what re-armed it.
#
# gothicRoot is hardcoded to this machine's install, as engine-batch.ps1's
# $Gothic already is. environment-hazards.md is where a second machine goes.

projectName: DDS World Candidates

gothicRoot: C:\Program Files (x86)\Steam\steamapps\common\Gothic II

modFiles:
  assets:
    - mod
  # Only a world is ever staged here, so the retail scripts are what compile.
  # A minimal script set is a separate, unsized question - level-editor.md 16.2.
  defaultWorld: NEWWORLD\NEWWORLD.ZEN

modVdf:
  output:  C:\Program Files (x86)\Steam\steamapps\common\Gothic II\Data\ModVDF\DDS-CAND.mod
  comment: Daedalus Dialog Suite - engine candidates

gothicIniOverrides:
  # The logo videos are two unskippable clips in front of every single run.
  - 'GAME.playLogoVideos' : '0'
